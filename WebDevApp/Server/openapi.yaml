openapi: 3.0.0
info:
  title: Mental Health App API
  version: 1.0.0
  description: API for managing events, doctors, and user authentication.

servers:
  - url: /api

# This creates the collapsible folders in the UI
tags:
  - name: Auth
    description: User registration, login, and sessions
  - name: Events
    description: Mental health events and scheduling
  - name: Doctors
    description: Directory of healthcare professionals
  - name: Monitoring
    description: Request metrics

paths:
  # ==========================================
  # AUTH ROUTES
  # ==========================================
  /auth/signup:
    post:
      tags: [Auth]
      summary: Register a new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, example: "John Doe" }
                email: { type: string, example: "john@example.com" }
                password: { type: string, example: "secret123" }
      responses:
        "201":
          description: User created and logged in

  /auth/login:
    post:
      tags: [Auth]
      summary: Login a user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, example: "john@example.com" }
                password: { type: string, example: "secret123" }
      responses:
        "200":
          description: Logged in successfully

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout the current user
      responses:
        "200":
          description: Logged out successfully

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current logged-in user profile
      responses:
        "200":
          description: User profile returned
        "401":
          description: Not authenticated

  # ==========================================
  # DOCTORS ROUTES
  # ==========================================
  /doctors:
    get:
      tags: [Doctors]
      summary: List all doctors
      responses:
        "200":
          description: A list of doctors
    post:
      tags: [Doctors]
      summary: Create a new doctor profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, specialization, licenseNumber, phoneNumber, email]
              properties:
                name: { type: string, example: "Dr. Smith" }
                specialization: { type: string, example: "Psychiatrist" }
                licenseNumber: { type: string, example: "LIC-12345" }
                phoneNumber: { type: string, example: "555-0100" }
                email: { type: string, example: "smith@clinic.com" }
      responses:
        "201":
          description: Doctor created successfully

  /doctors/{id}:
    get:
      tags: [Doctors]
      summary: Get a doctor by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Doctor found
        "404":
          description: Doctor not found
    put:
      tags: [Doctors]
      summary: Update a doctor's profile
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                specialization: { type: string }
                licenseNumber: { type: string }
                phoneNumber: { type: string }
                email: { type: string }
      responses:
        "200":
          description: Doctor updated
        "404":
          description: Doctor not found
    delete:
      tags: [Doctors]
      summary: Delete a doctor
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Doctor deleted
        "404":
          description: Doctor not found

  # ==========================================
  # EVENTS ROUTES
  # ==========================================
  /events:
    get:
      tags: [Events]
      summary: Get a list of upcoming events (v1)
      description: The legacy v1 response shape remains available through November 20, 2026. Use /v2/events for the v2 envelope.
      security:
        - apiKey: []
      parameters:
        - name: after
          in: query
          required: false
          description: Only show events on or after this date (YYYY-MM-DD)
          schema: { type: string, format: date }
      responses:
        "200":
          description: A list of events in the v1 response shape
          headers:
            Deprecation:
              schema: { type: string, example: "true" }
            Sunset:
              schema: { type: string, example: "Fri, 20 Nov 2026 00:00:00 GMT" }
            Link:
              description: Link to the successor endpoint
              schema: { type: string, example: '</api/v2/events>; rel="successor-version"' }
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"
        "400":
          description: Invalid date format
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/SecurityUnavailable"

    post:
      tags: [Events]
      summary: Create a new event (admin only)
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, location, startTime]
              properties:
                title: { type: string, example: "Peer Support Circle" }
                description: { type: string, example: "Weekly student led group" }
                location: { type: string, example: "Library Annex, Room 4" }
                startTime: { type: string, format: date-time, example: "2026-09-20T17:00:00Z" }
      responses:
        "201":
          description: Event created
        "401":
          description: Not logged in
        "403":
          description: Not an admin

  /events/{id}:
    get:
      tags: [Events]
      summary: Get one event by ID (v1)
      description: The legacy v1 response shape remains available through November 20, 2026. Use /v2/events/{id} for the v2 envelope.
      security:
        - apiKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          example: "evt_204"
      responses:
        "200":
          description: Event in the v1 response shape
          headers:
            Deprecation:
              schema: { type: string, example: "true" }
            Sunset:
              schema: { type: string, example: "Fri, 20 Nov 2026 00:00:00 GMT" }
            Link:
              description: Link to the successor endpoint
              schema: { type: string, example: '</api/v2/events>; rel="successor-version"' }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "404":
          description: Event not found
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/SecurityUnavailable"

    patch:
      tags: [Events]
      summary: Update an event (admin only)
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          example: "evt_204"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                description: { type: string }
                location: { type: string }
                startTime: { type: string, format: date-time }
                cancelled: { type: boolean, example: true }
      responses:
        "200":
          description: Event updated
        "401":
          description: Not logged in
        "403":
          description: Not an admin
        "404":
          description: Event not found

    delete:
      tags: [Events]
      summary: Delete an event (admin only)
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          example: "evt_204"
      responses:
        "204":
          description: Event deleted
        "401":
          description: Not logged in
        "403":
          description: Not an admin
        "404":
          description: Event not found

# ==========================================
# VERSIONED EVENTS AND MONITORING
# ==========================================
  /v2/events:
    get:
      tags: [Events]
      summary: List events using the v2 response envelope
      description: The legacy /events route remains available with its v1 response shape through November 20, 2026.
      security:
        - apiKey: []
      parameters:
        - name: after
          in: query
          required: false
          description: Only show events on or after this date (YYYY-MM-DD)
          schema: { type: string, format: date }
      responses:
        "200":
          description: Event list wrapped with a count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventListV2"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/SecurityUnavailable"

  /v2/events/{id}:
    get:
      tags: [Events]
      summary: Get one event using the v2 response envelope
      security:
        - apiKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          example: "evt_204"
      responses:
        "200":
          description: Event wrapped in a data object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventEnvelopeV2"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Event not found
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/SecurityUnavailable"

  /stats:
    servers:
      - url: /
    get:
      tags: [Monitoring]
      summary: Get in-memory request metrics
      security:
        - apiKey: []
      responses:
        "200":
          description: Metrics since the server started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stats"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/SecurityUnavailable"

# ==========================================
# COMPONENTS & SCHEMAS
# ==========================================
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: >
        Key issued privately to the consuming team. Required for public event
        reads and /stats. Never include a real key in source or documentation.
    sessionCookie:
      type: apiKey
      in: cookie
      name: connect.sid
      description: Session cookie set by POST /auth/login.

  responses:
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: "Missing or invalid API key"
    TooManyRequests:
      description: Rate limit exceeded (100 requests per minute per key).
      headers:
        Retry-After:
          description: Seconds until the caller may try again
          schema:
            type: integer
            example: 42
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: "Too many requests"
              retryAfter:
                type: integer
                example: 42
    SecurityUnavailable:
      description: API key authentication is not configured on the server
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: "API key authentication is not configured"

  schemas:
    EventListV2:
      type: object
      required: [data, count]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Event"
        count: { type: integer, example: 2 }
    EventEnvelopeV2:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Event"
    Stats:
      type: object
      required: [startedAt, uptimeSeconds, total, clientErrors, serverErrors, errorRatePercent, avgMs, routes, partnerFallbacks]
      properties:
        startedAt: { type: string, format: date-time }
        uptimeSeconds: { type: integer }
        total: { type: integer }
        clientErrors: { type: integer }
        serverErrors: { type: integer }
        errorRatePercent: { type: number }
        avgMs: { type: number }
        routes:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/RouteStats"
        partnerFallbacks: { type: integer }
    RouteStats:
      type: object
      required: [count, clientErrors, serverErrors, avgMs, maxMs]
      properties:
        count: { type: integer }
        clientErrors: { type: integer }
        serverErrors: { type: integer }
        avgMs: { type: number }
        maxMs: { type: number }
    Event:
      type: object
      required: [id, title, location, startTime, cancelled]
      properties:
        id: { type: string, example: "evt_204" }
        title: { type: string, example: "Exam Season Stress Workshop" }
        description: { type: string, nullable: true, example: "Drop-in session" }
        location: { type: string, description: "Name of a campus venue. Not a street address; all events take place on campus.", example: "Student Center, Room 2" }
        startTime: { type: string, format: date-time, example: "2026-09-15T14:00:00Z" }
        cancelled: { type: boolean, example: false }